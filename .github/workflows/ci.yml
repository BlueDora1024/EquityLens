name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Run release-quality tests
        env:
          PYTHON_BIN: ${{ github.workspace }}/.venv/bin/python
          QMLLINT_BIN: ${{ github.workspace }}/.venv/bin/pyside6-qmllint
        run: ./scripts/test.sh full
      - name: Verify public tree policy
        run: ${{ github.workspace }}/.venv/bin/python scripts/check_public_repo.py .
