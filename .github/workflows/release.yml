name: Release macOS apps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v1.0.0
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Build and verify native bundle
        env:
          EQUITYLENS_TARGET_ARCH: ${{ matrix.arch }}
          PYTHON_BIN: ${{ github.workspace }}/.venv/bin/python
          PYINSTALLER_BIN: ${{ github.workspace }}/.venv/bin/pyinstaller
          QMLLINT_BIN: ${{ github.workspace }}/.venv/bin/pyside6-qmllint
        run: ./scripts/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EquityLens-${{ matrix.arch }}
          path: |
            dist/EquityLens-v*-${{ matrix.arch }}.zip
            dist/EquityLens-v*-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --generate-notes --verify-tag
